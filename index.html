<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">

<title>Snake Game</title>

<style>
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

body {
    margin: 0;
    background: #101010;
    color: white;
    font-family: Arial, sans-serif;
    text-align: center;
    overflow: hidden;
}

h1 {
    margin: 18px 0 5px;
    font-size: 28px;
}

#score {
    font-size: 20px;
    margin-bottom: 12px;
}

.game-container {
    width: min(92vw, 420px);
    margin: auto;
}

canvas {
    width: 100%;
    aspect-ratio: 1 / 1;
    background: #181818;
    border: 3px solid #fff;
    display: block;
    touch-action: none;
}

.controls {
    width: 210px;
    margin: 18px auto;
    display: grid;
    grid-template-columns: 70px 70px 70px;
    grid-template-rows: 60px 60px;
    gap: 5px;
}

button {
    border: none;
    border-radius: 12px;
    background: #333;
    color: white;
    font-size: 25px;
    font-weight: bold;
}

button:active {
    background: #555;
}

.up {
    grid-column: 2;
}

.left {
    grid-column: 1;
}

.down {
    grid-column: 2;
}

.right {
    grid-column: 3;
    grid-row: 2;
}

#restart {
    margin-top: 5px;
    padding: 12px 25px;
    font-size: 17px;
    background: #00a854;
}
</style>
</head>

<body>

<h1>🐍 Snake Game</h1>

<div id="score">Score: 0</div>

<div class="game-container">

<canvas id="game" width="400" height="400"></canvas>

<div class="controls">
    <button class="up" onclick="changeDirection('UP')">⬆️</button>
    <button class="left" onclick="changeDirection('LEFT')">⬅️</button>
    <button class="down" onclick="changeDirection('DOWN')">⬇️</button>
    <button class="right" onclick="changeDirection('RIGHT')">➡️</button>
</div>

<button id="restart" onclick="restartGame()">🔄 Restart</button>

</div>

<script>

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const box = 20;
const size = canvas.width / box;

let snake;
let food;
let direction;
let nextDirection;
let score;
let gameOver;
let game;

function startGame() {

    snake = [
        {x: 200, y: 200},
        {x: 180, y: 200},
        {x: 160, y: 200}
    ];

    food = createFood();

    direction = "RIGHT";
    nextDirection = "RIGHT";

    score = 0;
    gameOver = false;

    updateScore();

    clearInterval(game);
    game = setInterval(updateGame, 110);
}

function createFood() {

    let newFood;

    do {
        newFood = {
            x: Math.floor(Math.random() * size) * box,
            y: Math.floor(Math.random() * size) * box
        };
    } while (
        snake &&
        snake.some(part =>
            part.x === newFood.x &&
            part.y === newFood.y
        )
    );

    return newFood;
}

function updateGame() {

    if (gameOver) return;

    direction = nextDirection;

    let head = {
        x: snake[0].x,
        y: snake[0].y
    };

    if (direction === "UP") head.y -= box;
    if (direction === "DOWN") head.y += box;
    if (direction === "LEFT") head.x -= box;
    if (direction === "RIGHT") head.x += box;

    if (
        head.x < 0 ||
        head.y < 0 ||
        head.x >= canvas.width ||
        head.y >= canvas.height ||
        hitSelf(head)
    ) {
        endGame();
        return;
    }

    snake.unshift(head);

    if (head.x === food.x && head.y === food.y) {

        score++;

        updateScore();

        food = createFood();

    } else {

        snake.pop();

    }

    draw();
}

function hitSelf(head) {

    return snake.some(part =>
        part.x === head.x &&
        part.y === head.y
    );
}

function draw() {

    ctx.fillStyle = "#181818";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // Food
    ctx.fillStyle = "#ff3030";

    ctx.beginPath();
    ctx.arc(
        food.x + box / 2,
        food.y + box / 2,
        box / 2 - 2,
        0,
        Math.PI * 2
    );

    ctx.fill();

    // Snake
    snake.forEach((part, index) => {

        ctx.fillStyle =
            index === 0 ? "#00ff66" : "#00c853";

        ctx.fillRect(
            part.x + 1,
            part.y + 1,
            box - 2,
            box - 2
        );
    });
}

function changeDirection(newDirection) {

    if (
        newDirection === "UP" &&
        direction !== "DOWN"
    ) {
        nextDirection = "UP";
    }

    if (
        newDirection === "DOWN" &&
        direction !== "UP"
    ) {
        nextDirection = "DOWN";
    }

    if (
        newDirection === "LEFT" &&
        direction !== "RIGHT"
    ) {
        nextDirection = "LEFT";
    }

    if (
        newDirection === "RIGHT" &&
        direction !== "LEFT"
    ) {
        nextDirection = "RIGHT";
    }
}

function updateScore() {

    document.getElementById("score").innerText =
        "Score: " + score;
}

function endGame() {

    gameOver = true;

    clearInterval(game);

    setTimeout(() => {

        alert("Game Over! 🐍\nYour Score: " + score);

    }, 100);
}

function restartGame() {

    startGame();
    draw();
}

// Keyboard controls
document.addEventListener("keydown", function(e) {

    if (e.key === "ArrowUp")
        changeDirection("UP");

    if (e.key === "ArrowDown")
        changeDirection("DOWN");

    if (e.key === "ArrowLeft")
        changeDirection("LEFT");

    if (e.key === "ArrowRight")
        changeDirection("RIGHT");

});

// Swipe controls
let startX = 0;
let startY = 0;

canvas.addEventListener("touchstart", function(e) {

    startX = e.touches[0].clientX;
    startY = e.touches[0].clientY;

}, {passive: true});

canvas.addEventListener("touchend", function(e) {

    let endX = e.changedTouches[0].clientX;
    let endY = e.changedTouches[0].clientY;

    let dx = endX - startX;
    let dy = endY - startY;

    if (Math.abs(dx) > Math.abs(dy)) {

        if (dx > 30)
            changeDirection("RIGHT");

        else if (dx < -30)
            changeDirection("LEFT");

    } else {

        if (dy > 30)
            changeDirection("DOWN");

        else if (dy < -30)
            changeDirection("UP");
    }

}, {passive: true});

startGame();
draw();

</script>

</body>
  </html>
