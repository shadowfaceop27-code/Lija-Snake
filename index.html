<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Limon Babu Snake Game</title>

<style>
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

body {
    margin: 0;
    background: #101010;
    color: white;
    font-family: Arial, sans-serif;
    text-align: center;
}

h1 {
    font-size: 38px;
    margin: 18px 0 5px;
}

#score {
    font-size: 25px;
    margin-bottom: 15px;
}

#startScreen {
    min-height: 100vh;
    padding: 25px 15px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
}

#startImage {
    width: min(90%, 380px);
    max-height: 430px;
    object-fit: cover;
    border-radius: 22px;
    border: 4px solid white;
    box-shadow: 0 0 25px rgba(255,255,255,0.2);
}

#startText {
    font-size: 28px;
    font-weight: bold;
    margin: 22px 10px;
}

#startButton {
    background: #00c853;
    color: white;
    border: none;
    padding: 16px 40px;
    border-radius: 15px;
    font-size: 22px;
    font-weight: bold;
    cursor: pointer;
}

#gameScreen {
    display: none;
    padding-top: 10px;
}

canvas {
    background: #181818;
    border: 5px solid white;
    width: min(92vw, 630px);
    height: min(92vw, 630px);
    display: block;
    margin: auto;
}

.controls {
    margin: 28px auto 15px;
    width: 300px;
}

.controlRow {
    display: flex;
    justify-content: center;
}

.control {
    width: 95px;
    height: 75px;
    margin: 4px;
    border: none;
    border-radius: 18px;
    background: #303030;
    color: white;
    font-size: 35px;
    cursor: pointer;
}

.control:active {
    background: #00c853;
}

#restart {
    background: #00b94f;
    color: white;
    border: none;
    padding: 16px 45px;
    border-radius: 18px;
    font-size: 22px;
    font-weight: bold;
    cursor: pointer;
}

#message {
    font-size: 20px;
    margin-top: 10px;
}
</style>
</head>

<body>

<!-- START SCREEN -->

<div id="startScreen">

    <img id="startImage" src="16631.jpeg" alt="Start Image">

    <div id="startText">
        তাহলে শুরু করা যাক লিমন বাবু 😎
    </div>

    <button id="startButton" onclick="startGame()">
        🎮 START GAME
    </button>

</div>


<!-- GAME SCREEN -->

<div id="gameScreen">

    <h1>🐍 Snake Game</h1>

    <div id="score">
        Score: <span id="scoreValue">0</span>
    </div>

    <canvas id="game" width="600" height="600"></canvas>

    <div class="controls">

        <div class="controlRow">
            <button class="control" onclick="changeDirection('up')">⬆️</button>
        </div>

        <div class="controlRow">
            <button class="control" onclick="changeDirection('left')">⬅️</button>
            <button class="control" onclick="changeDirection('down')">⬇️</button>
            <button class="control" onclick="changeDirection('right')">➡️</button>
        </div>

    </div>

    <button id="restart" onclick="restartGame()">
        🔄 Restart
    </button>

    <div id="message"></div>

</div>


<!-- AUDIO -->

<audio id="bgMusic" src="Meaw9090.mp3" loop preload="auto"></audio>

<audio id="eatSound" src="Eating9090.mp3" preload="auto"></audio>

<audio id="gameOverSound" src="End9090.mp3" preload="auto"></audio>
