<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Limon Babu Snake Game</title>

<style>
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

body {
    margin: 0;
    background: #101010;
    color: white;
    font-family: Arial, sans-serif;
    text-align: center;
}

h1 {
    font-size: 38px;
    margin: 18px 0 5px;
}

#score {
    font-size: 25px;
    margin-bottom: 15px;
}

#startScreen {
    min-height: 100vh;
    padding: 25px 15px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
}

#startImage {
    width: min(90%, 380px);
    max-height: 430px;
    object-fit: cover;
    border-radius: 22px;
    border: 4px solid white;
    box-shadow: 0 0 25px rgba(255,255,255,0.2);
}

#startText {
    font-size: 28px;
    font-weight: bold;
    margin: 22px 10px;
}

#startButton {
    background: #00c853;
    color: white;
    border: none;
    padding: 16px 40px;
    border-radius: 15px;
    font-size: 22px;
    font-weight: bold;
    cursor: pointer;
}

#gameScreen {
    display: none;
    padding-top: 10px;
}

canvas {
    background: #181818;
    border: 5px solid white;
    width: min(92vw, 630px);
    height: min(92vw, 630px);
    display: block;
    margin: auto;
}

.controls {
    margin: 28px auto 15px;
    width: 300px;
}

.controlRow {
    display: flex;
    justify-content: center;
}

.control {
    width: 95px;
    height: 75px;
    margin: 4px;
    border: none;
    border-radius: 18px;
    background: #303030;
    color: white;
    font-size: 35px;
    cursor: pointer;
}

.control:active {
    background: #00c853;
}

#restart {
    background: #00b94f;
    color: white;
    border: none;
    padding: 16px 45px;
    border-radius: 18px;
    font-size: 22px;
    font-weight: bold;
    cursor: pointer;
}

#message {
    font-size: 20px;
    margin-top: 10px;
}
</style>
</head>

<body>

<div id="startScreen">

    <img id="startImage" src="16631.jpeg" alt="Start Image">

    <div id="startText">
        তাহলে শুরু করা যাক লিমন বাবু 😎
    </div>

    <button id="startButton">
        🎮 START GAME
    </button>

</div>


<div id="gameScreen">

    <h1>🐍 Snake Game</h1>

    <div id="score">
        Score: <span id="scoreValue">0</span>
    </div>

    <canvas id="game" width="600" height="600"></canvas>

    <div class="controls">

        <div class="controlRow">
            <button class="control" onclick="changeDirection('up')">⬆️</button>
        </div>

        <div class="controlRow">
            <button class="control" onclick="changeDirection('left')">⬅️</button>
            <button class="control" onclick="changeDirection('down')">⬇️</button>
            <button class="control" onclick="changeDirection('right')">➡️</button>
        </div>

    </div>

    <button id="restart" onclick="restartGame()">
        🔄 Restart
    </button>

    <div id="message"></div>

</div>


<audio id="bgMusic" src="Meaw9090.mp3" loop></audio>
<audio id="eatSound" src="Eating9090.mp3"></audio>
<audio id="gameOverSound" src="End9090.mp3"></audio>


<script>

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const box = 30;
const totalBoxes = 20;

let snake;
let food;
let direction;
let nextDirection;
let score;

let gameTimer = null;
let gameRunning = false;

let gameSpeed = 180;

const bgMusic = document.getElementById("bgMusic");
const eatSound = document.getElementById("eatSound");
const gameOverSound = document.getElementById("gameOverSound");

bgMusic.volume = 0.5;
eatSound.volume = 0.8;
gameOverSound.volume = 0.9;


/* START BUTTON */

document.getElementById("startButton").addEventListener("click", function() {

    document.getElementById("startScreen").style.display = "none";
    document.getElementById("gameScreen").style.display = "block";

    startGame();

});


/* START GAME */

function startGame() {

    bgMusic.currentTime = 0;
    bgMusic.play().catch(function() {});

    restartGame();

}


/* RESTART */

function restartGame() {

    if (gameTimer !== null) {
        clearTimeout(gameTimer);
    }

    snake = [
        {x: 10 * box, y: 10 * box},
        {x: 9 * box, y: 10 * box},
        {x: 8 * box, y: 10 * box}
    ];

    direction = "right";
    nextDirection = "right";

    score = 0;
    gameSpeed = 180;
    gameRunning = true;

    document.getElementById("scoreValue").innerText = "0";
    document.getElementById("message").innerText = "";

    createFood();

    drawGame();

}


/* FOOD */

function createFood() {

    food = {
        x: Math.floor(Math.random() * totalBoxes) * box,
        y: Math.floor(Math.random() * totalBoxes) * box
    };

    for (let part of snake) {

        if (food.x === part.x && food.y === part.y) {
            createFood();
            return;
        }

    }

}


/* DIRECTION */

function changeDirection(newDirection) {

    if (direction === "up" && newDirection === "down") return;
    if (direction === "down" && newDirection === "up") return;
    if (direction === "left" && newDirection === "right") return;
    if (direction === "right" && newDirection === "left") return;

    nextDirection = newDirection;

}


/* KEYBOARD */

document.addEventListener("keydown", function(event) {

    if (event.key === "ArrowUp") changeDirection("up");
    if (event.key === "ArrowDown") changeDirection("down");
    if (event.key === "ArrowLeft") changeDirection("left");
    if (event.key === "ArrowRight") changeDirection("right");

});


/* GAME */

function drawGame() {

    if (!gameRunning) return;

    direction = nextDirection;

    ctx.fillStyle = "#181818";
    ctx.fillRect(0, 0, canvas.width, canvas.height);


    /* FOOD */

    ctx.fillStyle = "#ff3030";

    ctx.beginPath();

    ctx.arc(
        food.x + box / 2,
        food.y + box / 2,
        box / 2 - 3,
        0,
        Math.PI * 2
    );

    ctx.fill();


    /* SNAKE */

    snake.forEach(function(part, index) {

        ctx.fillStyle =
            index === 0 ? "#00ff65" : "#00c853";

        ctx.fillRect(
            part.x + 2,
            part.y + 2,
            box - 4,
            box - 4
        );

    });


    let headX = snake[0].x;
    let headY = snake[0].y;


    if (direction === "up") headY -= box;
    if (direction === "down") headY += box;
    if (direction === "left") headX -= box;
    if (direction === "right") headX += box;


    /* WALL */

    if (
        headX < 0 ||
        headY < 0 ||
        headX >= canvas.width ||
        headY >= canvas.height
    ) {

        gameOver();
        return;

    }


    /* BODY */

    for (let part of snake) {

        if (
            headX === part.x &&
            headY === part.y
        ) {

            gameOver();
            return;

        }

    }


    snake.unshift({
        x: headX,
        y: headY
    });


    /* FOOD */

    if (
        headX === food.x &&
        headY === food.y
    ) {

        score++;

        document.getElementById("scoreValue").innerText = score;

        eatSound.currentTime = 0;
        eatSound.play().catch(function() {});


        /* SPEED */

        if (gameSpeed > 75) {
            gameSpeed -= 8;

            if (gameSpeed < 75) {
                gameSpeed = 75;
            }
        }

        createFood();

    } else {

        snake.pop();

    }


    /* NEXT MOVE */

    gameTimer = setTimeout(drawGame, gameSpeed);

}


/* GAME OVER */

function gameOver() {

    gameRunning = false;

    if (gameTimer !== null) {
        clearTimeout(gameTimer);
        gameTimer = null;
    }

    bgMusic.pause();
    bgMusic.currentTime = 0;

    gameOverSound.currentTime = 0;
    gameOverSound.play().catch(function() {});

    document.getElementById("message").innerText =
        "💀 Game Over! Score: " + score;

}


/* TOUCH */

let touchStartX = 0;
let touchStartY = 0;

canvas.addEventListener("touchstart", function(e) {

    touchStartX = e.touches[0].clientX;
    touchStartY = e.touches[0].clientY;

}, {passive: true});


canvas.addEventListener("touchend", function(e) {

    let touchEndX = e.changedTouches[0].clientX;
    let touchEndY = e.changedTouches[0].clientY;

    let dx = touchEndX - touchStartX;
    let dy = touchEndY - touchStartY;


    if (Math.abs(dx) > Math.abs(dy)) {

        if (dx > 30) changeDirection("right");
        if (dx < -30) changeDirection("left");

    } else {

        if (dy > 30) changeDirection("down");
        if (dy < -30) changeDirection("up");

    }

}, {passive: true});

</script>

</body>
</html>
